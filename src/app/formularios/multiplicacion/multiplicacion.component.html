<div>
<h1 class="mb-4 text-4xl font-extrabold tracking-tight text-gray-900 md:text-5xl lg:text-6xl dark:text-white">MULTIPLICACIÓN</h1>
  <form [formGroup]="formulario">
    <div class="mb-3 ms-6">
      <label for="numero1" class="form-label block mb-2 text-sm font-medium text-gray-900 dark:text-white">Numero 1</label>
      <input type="number" class="form-control block w-50 p-4 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" id="numero1" formControlName="numero1">
      <label for="numero2" class="form-label block mb-2 text-sm font-medium text-gray-900 dark:text-white">Numero 2</label>
      <input type="number" class="form-control block w-50 p-4 text-gray-900 border border-gray-300 rounded-lg bg-gray-50 text-base focus:ring-blue-500 focus:border-blue-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-blue-500 dark:focus:border-blue-500" id="numero2" formControlName="numero2">
      <br>
      <button (click)="multiNumeros()" type="button" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Multiplicar</button>
      <h2 class="dark:text-white">Resultado: {{resultado}}</h2>
    </div>
  </form>
</div>
